plugins {
    id 'com.android.application'
}

android {
    namespace 'com.impulso.motivacion'
    compileSdk 34

    defaultConfig {
        applicationId "com.impulso.motivacion"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}

