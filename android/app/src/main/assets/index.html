    const SEEN_STORAGE_KEY = 'impulso_seen_quotes_v1';

    function getSeenIds() {
      try {
        const s = localStorage.getItem(SEEN_STORAGE_KEY);
        return s ? JSON.parse(s) : [];
      } catch { return []; }
    }

    function markQuoteSeen(id) {
      try {
        const prev = getSeenIds();
        const next = [id, ...prev.filter(x => x !== id)].slice(0, 10);
        localStorage.setItem(SEEN_STORAGE_KEY, JSON.stringify(next));
      } catch {}
    }

    function getPersonalizedQuotes(profile, categoryFilter = 'all') {
      const seenIds = new Set(getSeenIds());
      const preferredCategories = new Set(profile?.categories || []);
      const visualStyle = profile?.visualStyle || 'nature';
      const preferredTone = profile?.tone || 'inspirador';

      return MOTIVATIONAL_QUOTES
        .filter(item => categoryFilter === 'all' || item.category === categoryFilter)
        .map(item => {
          let score = Math.random() * 4; // Always shuffle
          if (preferredCategories.has(item.category)) score += 5;
          if (item.visualTag === visualStyle) score += 2.5;
          if (item.tone === preferredTone) score += 2;
          if (!seenIds.has(item.id)) score += 6; // Prioritize unseen quotes
          return { ...item, matchScore: score };
        })
        .sort((a, b) => b.matchScore - a.matchScore);
    }

    function pickNotificationQuote(profile, excludeId = null, categoryFilter = 'all') {
      const ranked = getPersonalizedQuotes(profile, categoryFilter).filter(q => q.id !== excludeId);
      const chosen = ranked[0] || MOTIVATIONAL_QUOTES[Math.floor(Math.random() * MOTIVATIONAL_QUOTES.length)];
      markQuoteSeen(chosen.id);
      return chosen;
    }

    async function fireWebNotification(quoteObj) {
      const cat = CATEGORIES.find(c => c.id === quoteObj.category)?.name || 'Impulso';
      try {
        if (window.ImpulsoNative && window.ImpulsoNative.updateWidgetAndNotify) {
          window.ImpulsoNative.updateWidgetAndNotify(quoteObj.quote, quoteObj.author, cat, true);
          return;
        }
        if ('Notification' in window) {
          if (Notification.permission === 'default') {
            await Notification.requestPermission();
          }
          if (Notification.permission === 'granted') {
            new Notification(`✨ ${cat} — Impulso Diario`, {
              body: `“${quoteObj.quote}” — ${quoteObj.author}\n💡 ${quoteObj.reflection}`,
              icon: '/icon.svg'
            });
          }
        }
      } catch (e) {}
    }

    async function downloadPoster(quoteObj, categoryName) {
      const canvas = document.createElement('canvas');
      canvas.width = 1080;
      canvas.height = 1350;
      const ctx = canvas.getContext('2d');

      const grad = ctx.createLinearGradient(0, 0, 1080, 1350);
      grad.addColorStop(0, '#0f172a');
      grad.addColorStop(0.5, '#1e1b4b');
      grad.addColorStop(1, '#090d16');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      try {
        const img = await new Promise((res, rej) => {
          const i = new Image();
          i.crossOrigin = 'anonymous';
          i.onload = () => res(i);
          i.onerror = rej;
          i.src = quoteObj.image;
        });
        const scale = Math.max(canvas.width / img.width, canvas.height / img.height);
        const x = (canvas.width - img.width * scale) / 2;
        const y = (canvas.height - img.height * scale) / 2;
        ctx.drawImage(img, x, y, img.width * scale, img.height * scale);
      } catch (e) {}

      const overlay = ctx.createLinearGradient(0, 0, 0, canvas.height);
      overlay.addColorStop(0, 'rgba(9, 13, 22, 0.55)');
      overlay.addColorStop(0.5, 'rgba(9, 13, 22, 0.72)');
      overlay.addColorStop(1, 'rgba(9, 13, 22, 0.92)');
      ctx.fillStyle = overlay;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = 'rgba(251, 191, 36, 0.35)';
      ctx.lineWidth = 3;
      ctx.strokeRect(64, 64, canvas.width - 128, canvas.height - 128);

      ctx.fillStyle = '#fbbf24';
      ctx.font = '600 28px Inter, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText((categoryName || 'IMPULSO').toUpperCase(), canvas.width / 2, 190);

      ctx.fillStyle = '#ffffff';
      ctx.font = 'italic 600 50px Georgia, serif';
      const words = `“${quoteObj.quote}”`.split(' ');
      const lines = [];
      let currentLine = words[0];
      for (let i = 1; i < words.length; i++) {
        if (ctx.measureText(currentLine + ' ' + words[i]).width < canvas.width - 240) {
          currentLine += ' ' + words[i];
        } else {
          lines.push(currentLine);
          currentLine = words[i];
        }
      }
      lines.push(currentLine);
      let startY = 500 - (lines.length * 34);
      lines.forEach((line, idx) => ctx.fillText(line, canvas.width / 2, startY + idx * 72));

      ctx.fillStyle = '#fcd34d';
      ctx.font = '600 32px Inter, sans-serif';
      ctx.fillText(`— ${quoteObj.author}`, canvas.width / 2, startY + lines.length * 72 + 55);

      ctx.fillStyle = 'rgba(251, 191, 36, 0.75)';
      ctx.font = '600 24px Inter, sans-serif';
      ctx.fillText('IMPULSO • MOTIVACIÓN DIARIA', canvas.width / 2, 1240);

      const link = document.createElement('a');
      link.download = `impulso-${quoteObj.id}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    }

    function OnboardingQuiz({ initialProfile, onComplete, onCancel }) {
      const [stepIndex, setStepIndex] = useState(0);
      const [name, setName] = useState(initialProfile?.name || '');
      const [moodOption, setMoodOption] = useState(initialProfile?.moodOption || null);
      const [obstacleOption, setObstacleOption] = useState(initialProfile?.obstacleOption || null);
      const [selectedCategories, setSelectedCategories] = useState(initialProfile?.categories || ['metas', 'disciplina']);
      const [visualOption, setVisualOption] = useState(initialProfile?.visualOption || 'mountains');
      const [schedules, setSchedules] = useState(initialProfile?.schedules || DEFAULT_SCHEDULES);

      const currentQuestion = QUIZ_QUESTIONS[stepIndex];
      const progressPercent = Math.round(((stepIndex + 1) / QUIZ_QUESTIONS.length) * 100);

      const toggleCategory = (catId) => {
        setSelectedCategories(prev =>
          prev.includes(catId) ? (prev.length > 1 ? prev.filter(id => id !== catId) : prev) : [...prev, catId]
        );
      };

      const canProceed = () => {
        if (stepIndex === 0) return Boolean(moodOption);
        if (stepIndex === 1) return Boolean(obstacleOption);
        if (stepIndex === 2) return selectedCategories.length > 0;
        if (stepIndex === 3) return Boolean(visualOption);
        return true;
      };

      const handleNext = () => {
        if (stepIndex < QUIZ_QUESTIONS.length - 1) {
          if (stepIndex === 0 && moodOption) {
            const qOpt = QUIZ_QUESTIONS[0].options.find(o => o.id === moodOption);
            if (qOpt?.boostCategories) {
              setSelectedCategories(prev => Array.from(new Set([...prev, ...qOpt.boostCategories])));
            }
          }
          setStepIndex(s => s + 1);
        } else {
          if (window.confetti) {
            window.confetti({ particleCount: 70, spread: 65, origin: { y: 0.6 } });
          }
          const moodObj = QUIZ_QUESTIONS[0].options.find(o => o.id === moodOption);
          const visualObj = QUIZ_QUESTIONS[3].options.find(o => o.id === visualOption);
          onComplete({
            name: name.trim() || 'Campeón/a',
            moodOption,
            obstacleOption,
            categories: selectedCategories,
            visualOption,
            visualStyle: visualObj?.visualTag || 'nature',
            tone: moodObj?.tone || 'inspirador',
            schedules
          });
        }
      };

      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 flex flex-col justify-between p-5 max-w-md mx-auto relative overflow-hidden border-x border-slate-900">
          <div className="pointer-events-none fixed -top-28 -left-24 w-72 h-72 bg-amber-500/15 rounded-full blur-3xl" />
          <div className="z-10 pt-2">
            <div className="flex items-center justify-between mb-3">
              <span className="text-amber-400 font-semibold text-sm">✨ Personalización • Paso {stepIndex + 1} de {QUIZ_QUESTIONS.length}</span>
              {onCancel && (
                <button onClick={onCancel} className="text-xs text-slate-400 hover:text-white px-3 py-1 rounded-full bg-slate-900 border border-slate-800">
                  Cerrar
                </button>
              )}
            </div>
            <div className="w-full h-2 bg-slate-900 rounded-full overflow-hidden border border-slate-800">
              <div className="h-full bg-gradient-to-r from-amber-400 to-orange-500 transition-all duration-300 rounded-full" style={{ width: `${progressPercent}%` }} />
            </div>
          </div>

          <div className="z-10 my-auto py-6">
            {stepIndex === 0 && (
              <div className="mb-5">
                <label className="block text-xs font-medium text-slate-400 uppercase tracking-wider mb-1.5">
                  ¿Cómo te llamas? (Opcional)
                </label>
                <input
                  type="text"
                  value={name}
                  onChange={e => setName(e.target.value)}
                  placeholder="Ej. Gonza"
                  className="w-full px-4 py-3 rounded-2xl bg-slate-900/90 border border-slate-800 focus:border-amber-400 focus:outline-none text-slate-100 placeholder-slate-500 text-sm"
                />
              </div>
            )}

            <h1 className="text-2xl font-bold tracking-tight text-white mb-2 leading-snug">{currentQuestion.title}</h1>
            <p className="text-sm text-slate-400 mb-6">{currentQuestion.subtitle}</p>

            {!currentQuestion.isScheduleStep ? (
              <div className="space-y-3">
                {currentQuestion.options.map(opt => {
                  const isSelected =
                    stepIndex === 0 ? moodOption === opt.id :
                    stepIndex === 1 ? obstacleOption === opt.id :
                    stepIndex === 2 ? selectedCategories.includes(opt.id) :
                    visualOption === opt.id;

                  const handleSelect = () => {
                    if (stepIndex === 0) setMoodOption(opt.id);
                    if (stepIndex === 1) setObstacleOption(opt.id);
                    if (stepIndex === 2) toggleCategory(opt.id);
                    if (stepIndex === 3) setVisualOption(opt.id);
                  };

                  return (
                    <button
                      key={opt.id}
                      onClick={handleSelect}
                      className={`w-full text-left p-4 rounded-2xl border transition-all flex items-center justify-between gap-3 ${
                        isSelected
                          ? 'bg-gradient-to-r from-amber-500/20 to-orange-500/10 border-amber-400/80 shadow-lg shadow-amber-500/10'
                          : 'bg-slate-900/70 border-slate-800/90 hover:border-slate-700'
                      }`}
                    >
                      <div className="flex items-center gap-3.5">
                        <span className="text-2xl">{opt.emoji}</span>
                        <div>
                          <div className="font-semibold text-sm text-slate-100">{opt.label}</div>
                          {opt.description && <div className="text-xs text-slate-400 mt-0.5">{opt.description}</div>}
                        </div>
                      </div>
                      <div className={`w-6 h-6 rounded-full flex items-center justify-center border text-xs font-bold ${
                        isSelected ? 'bg-amber-400 border-amber-400 text-slate-950' : 'border-slate-700 bg-slate-950'
                      }`}>
                        {isSelected ? '✓' : ''}
                      </div>
                    </button>
                  );
                })}
              </div>
            ) : (
              <div className="space-y-3.5">
                {schedules.map(sched => (
                  <div key={sched.id} className={`p-4 rounded-2xl border ${sched.enabled ? 'bg-slate-900/90 border-amber-500/50' : 'bg-slate-900/40 border-slate-800 opacity-60'}`}>
                    <div className="flex items-center justify-between mb-2">
                      <div>
                        <div className="font-semibold text-sm text-white">🔔 {sched.label}</div>
                        <div className="text-xs text-slate-400">Frase + Foto motivadora</div>
                      </div>
                      <input
                        type="checkbox"
                        checked={sched.enabled}
                        onChange={e => setSchedules(prev => prev.map(s => s.id === sched.id ? { ...s, enabled: e.target.checked } : s))}
                        className="w-5 h-5 accent-amber-400"
                      />
                    </div>
                    {sched.enabled && (
                      <div className="flex items-center justify-between pt-2 border-t border-slate-800 text-xs">
                        <span className="text-slate-400">Horario programado:</span>
                        <input
                          type="time"
                          value={sched.time}
                          onChange={e => setSchedules(prev => prev.map(s => s.id === sched.id ? { ...s, time: e.target.value } : s))}
                          className="bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1 text-amber-300 font-semibold"
                        />
                      </div>
                    )}
                  </div>
                ))}
              </div>
            )}
          </div>

          <div className="z-10 flex items-center gap-3 pt-3 border-t border-slate-900">
            {stepIndex > 0 && (
              <button onClick={() => setStepIndex(s => s - 1)} className="px-4 py-3.5 rounded-2xl bg-slate-900 border border-slate-800 text-slate-300 text-sm font-medium">
                ← Atrás
              </button>
            )}
            <button
              disabled={!canProceed()}
              onClick={handleNext}
              className={`flex-1 py-3.5 px-6 rounded-2xl font-semibold text-sm transition shadow-lg ${
                canProceed()
                  ? 'bg-gradient-to-r from-amber-400 to-orange-500 text-slate-950 hover:brightness-105'
                  : 'bg-slate-800 text-slate-500 cursor-not-allowed'
              }`}
            >
              {stepIndex === QUIZ_QUESTIONS.length - 1 ? 'Crear mi Plan Motivacional ✨' : 'Continuar →'}
            </button>
          </div>
        </div>
      );
    }

    function QuoteCard({ item, isFavorite, onToggleFavorite, onPinToWidget, isPinnedWidget, featured }) {

      const shareWhatsApp = () => {

        window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');

          <div className="relative z-10 p-5 flex items-center justify-between">

            <button

              <button

              >
                🖼️ Foto HD

              {onPinToWidget && (

                      ? 'bg-amber-400 text-slate-950 border-amber-300'

    function App() {
      const urlParams = new URLSearchParams(window.location.search);
      const isStandaloneWidgetMode = urlParams.get('widgetMode') === '1';

      const [profile, setProfile] = useState(() => {
        try {
          const s = localStorage.getItem('impulso_user_profile_v1');
          return s ? JSON.parse(s) : null;
        } catch { return null; }
      });
      const [favorites, setFavorites] = useState(() => {
        try {
          const s = localStorage.getItem('impulso_favorites_v1');
          return s ? JSON.parse(s) : ['q1', 'q5'];
        } catch { return ['q1', 'q5']; }
      });
      const [widgetConfig, setWidgetConfig] = useState(() => {
        try {
          const s = localStorage.getItem('impulso_widget_config_v1');
          return s ? JSON.parse(s) : { size: '4x2', theme: 'photo', sourceCategory: 'profile', updateInterval: '6h' };
        } catch { return { size: '4x2', theme: 'photo', sourceCategory: 'profile', updateInterval: '6h' }; }
      });
      const [widgetQuote, setWidgetQuote] = useState(() => {
        return pickNotificationQuote(profile);
      });
      const [currentQuote, setCurrentQuote] = useState(() => widgetQuote);
      const [impulseCount, setImpulseCount] = useState(1);
      const [lastChangeReason, setLastChangeReason] = useState('Nueva al abrir la app');
      const [savedWidgetToast, setSavedWidgetToast] = useState(false);

      const [showQuiz, setShowQuiz] = useState(!profile && !isStandaloneWidgetMode);
      const [activeTab, setActiveTab] = useState('home');
      const [selectedCategory, setSelectedCategory] = useState('all');
      const [activeNotification, setActiveNotification] = useState(null);
      const [showMobileModal, setShowMobileModal] = useState(false);
      const [deferredInstallPrompt, setDeferredInstallPrompt] = useState(null);

      useEffect(() => {
        const handler = (e) => {
          e.preventDefault();
          setDeferredInstallPrompt(e);
        };
        window.addEventListener('beforeinstallprompt', handler);
        return () => window.removeEventListener('beforeinstallprompt', handler);
      }, []);

      // Automatically rotate the quote whenever the user returns to / opens the app
      useEffect(() => {
        const handleVisibility = () => {
          if (document.visibilityState === 'visible' && profile) {
            const nextQ = pickNotificationQuote(profile, currentQuote?.id, selectedCategory);
            setCurrentQuote(nextQ);
            setWidgetQuote(nextQ);
            setImpulseCount(c => c + 1);
            setLastChangeReason('Renovada al abrir la aplicación');
          }
        };
        document.addEventListener('visibilitychange', handleVisibility);
        return () => document.removeEventListener('visibilitychange', handleVisibility);
      }, [profile, currentQuote, selectedCategory]);

      useEffect(() => {
        if (profile) localStorage.setItem('impulso_user_profile_v1', JSON.stringify(profile));
      }, [profile]);

      useEffect(() => {
        localStorage.setItem('impulso_favorites_v1', JSON.stringify(favorites));
      }, [favorites]);

      useEffect(() => {
        localStorage.setItem('impulso_widget_config_v1', JSON.stringify(widgetConfig));
      }, [widgetConfig]);

      useEffect(() => {
        if (widgetQuote) {
          localStorage.setItem('impulso_widget_quote_v1', JSON.stringify(widgetQuote));
          if (window.ImpulsoNative && window.ImpulsoNative.updateWidgetAndNotify) {
            const cat = CATEGORIES.find(c => c.id === widgetQuote.category)?.name || 'Impulso';
            window.ImpulsoNative.updateWidgetAndNotify(widgetQuote.quote, widgetQuote.author, cat, false);
          }
        }
      }, [widgetQuote]);

      const quotesPool = useMemo(() => getPersonalizedQuotes(profile, selectedCategory), [profile, selectedCategory]);
      const favoriteQuotes = useMemo(() => MOTIVATIONAL_QUOTES.filter(q => favorites.includes(q.id)), [favorites]);

      const toggleFavorite = (id) => {
        setFavorites(prev => prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]);
      };

      const refreshWidgetQuote = () => {
        let pool = MOTIVATIONAL_QUOTES;
        if (widgetConfig.sourceCategory === 'favorites' && favoriteQuotes.length > 0) {
          pool = favoriteQuotes;
        } else if (widgetConfig.sourceCategory !== 'profile') {
          pool = MOTIVATIONAL_QUOTES.filter(q => q.category === widgetConfig.sourceCategory);
        } else {
          pool = getPersonalizedQuotes(profile);
        }
        const others = pool.filter(q => q.id !== widgetQuote?.id);
        const list = others.length > 0 ? others : pool;
        setWidgetQuote(list[Math.floor(Math.random() * list.length)] || MOTIVATIONAL_QUOTES[0]);
      };

      const pinQuoteToWidget = (item) => {
        setWidgetQuote(item);
        setActiveTab('widget');
      };

      const openFloatingWidgetWindow = () => {
        const w = widgetConfig.size === '2x2' ? 310 : 440;
        const h = widgetConfig.size === '4x4' ? 420 : 250;
        window.open(
          `/?widgetMode=1`,
          'ImpulsoFloatingWidget',
          `width=${w},height=${h},menubar=no,toolbar=no,location=no,status=no,resizable=yes`
        );
      };

      const triggerMotivation = (customProf = profile) => {
        const chosen = pickNotificationQuote(customProf, currentQuote?.id, selectedCategory);
        setCurrentQuote(chosen);
        setWidgetQuote(chosen);
        setImpulseCount(c => c + 1);
        setLastChangeReason('Recibida por notificación');
        setActiveNotification(chosen);
        fireWebNotification(chosen);
      };

      const nextMomentQuote = (cat = selectedCategory) => {
        const chosen = pickNotificationQuote(profile, currentQuote?.id, cat);
        setCurrentQuote(chosen);
        setWidgetQuote(chosen);
        setImpulseCount(c => c + 1);
        setLastChangeReason('Nuevo impulso descubierto');
      };

      // If opened as Floating Desktop/Mobile Widget Window (?widgetMode=1)
      if (isStandaloneWidgetMode) {
        const catObj = CATEGORIES.find(c => c.id === widgetQuote?.category);
        return (
          <div className="w-screen h-screen overflow-hidden relative flex flex-col justify-between p-5 select-none bg-slate-950">
            {widgetConfig.theme === 'photo' && (
              <>
                <img src={widgetQuote.image} alt="" className="absolute inset-0 w-full h-full object-cover" />
                <div className="absolute inset-0 bg-gradient-to-t from-black/90 via-black/60 to-black/35" />
              </>
            )}
            {widgetConfig.theme === 'glass' && <div className="absolute inset-0 bg-slate-900/95 backdrop-blur-xl" />}
            {widgetConfig.theme === 'gold' && <div className="absolute inset-0 bg-gradient-to-br from-amber-950 via-stone-900 to-slate-950" />}
            {widgetConfig.theme === 'aurora' && <div className="absolute inset-0 bg-gradient-to-br from-indigo-950 via-teal-950 to-slate-950" />}

            <div className="relative z-10 flex items-center justify-between">
              <span className="text-[11px] font-bold uppercase tracking-wider text-amber-300 flex items-center gap-1.5">
                <span>✨</span>
                <span>{catObj?.name || 'Impulso Motivación'}</span>
              </span>
              <button
                onClick={refreshWidgetQuote}
                className="px-2.5 py-1 rounded-full bg-black/45 hover:bg-black/70 text-xs text-amber-300 border border-white/15 transition"
                title="Siguiente frase motivadora"
              >
                🔄 Cambiar
              </button>
            </div>

            <div className="relative z-10 my-auto py-2">
              <p className="font-serif italic text-white font-semibold text-base sm:text-lg leading-snug drop-shadow">
                “{widgetQuote.quote}”
              </p>
              <p className="text-xs font-semibold text-amber-300 mt-1.5">— {widgetQuote.author}</p>
            </div>

            <div className="relative z-10 text-[11px] text-slate-300 bg-black/40 px-3 py-1.5 rounded-xl border border-white/10 truncate">
              💡 {widgetQuote.reflection}
            </div>
          </div>
        );
      }

      if (showQuiz) {
        return (
          <OnboardingQuiz
            initialProfile={profile}
            onComplete={(newProf) => {
              setProfile(newProf);
              setShowQuiz(false);
              setTimeout(() => triggerMotivation(newProf), 600);
            }}
            onCancel={profile ? () => setShowQuiz(false) : null}
          />
        );
      }

      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 pb-28 max-w-md mx-auto relative shadow-2xl shadow-black border-x border-slate-900">
          {/* Android Notification Simulator Banner */}
          {activeNotification && (
            <div className="fixed top-3 inset-x-3 z-50 max-w-md mx-auto animate-slide-up">
              <div className="rounded-3xl bg-slate-900/95 backdrop-blur-xl border border-amber-400/50 shadow-2xl shadow-black overflow-hidden">
                <div className="px-4 pt-3 pb-2 flex items-center justify-between border-b border-slate-800">
                  <div className="flex items-center gap-2">
                    <span className="text-xs font-bold text-amber-400 uppercase">🔔 Notificación Impulso • Ahora</span>
                  </div>
                  <button onClick={() => setActiveNotification(null)} className="text-xs text-slate-400 hover:text-white px-2 py-0.5 rounded-lg bg-slate-800">
                    ✕
                  </button>
                </div>
                <div className="p-4 flex gap-3.5 items-start">
                  <img src={activeNotification.image} alt="" className="w-20 h-20 rounded-2xl object-cover flex-shrink-0 border border-white/10" />
                  <div className="flex-1 min-w-0">
                    <p className="text-sm font-serif italic text-white leading-snug mb-1">“{activeNotification.quote}”</p>
                    <p className="text-xs font-medium text-amber-300 mb-1.5">— {activeNotification.author}</p>
                    <p className="text-xs text-slate-300 bg-slate-950/80 rounded-xl p-2 border border-slate-800">
                      💡 {activeNotification.reflection}
                    </p>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* Header */}
          <header className="sticky top-0 z-30 bg-slate-950/85 backdrop-blur-xl border-b border-slate-900 px-5 py-3.5 flex items-center justify-between">
            <div>
              <div className="text-amber-400 text-xs font-bold uppercase tracking-wider">✨ Impulso Diario</div>
              <h1 className="text-lg font-bold text-white">Hola, {profile?.name || 'Campeón/a'} 👋</h1>
            </div>
            <div className="flex items-center gap-2">
              <button
                onClick={() => setShowMobileModal(true)}
                className="px-3 py-2 rounded-2xl bg-slate-900 hover:bg-slate-800 border border-amber-400/40 text-amber-300 font-bold text-xs transition"
                title="Descargar e instalar en tu celular"
              >
                📲 Celular
              </button>
              <button
                onClick={() => triggerMotivation()}
                className="px-3.5 py-2 rounded-2xl bg-gradient-to-r from-amber-400 to-orange-500 text-slate-950 font-bold text-xs shadow-lg shadow-amber-500/20 hover:brightness-105 active:scale-95 transition"
              >
                🔔 ¡Motívame!
              </button>
            </div>
          </header>

          {/* Modal para Descargar / Instalar en Celular con Código QR */}
          {showMobileModal && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
              <div className="w-full max-w-sm rounded-3xl bg-slate-900 border border-amber-400/40 p-5 space-y-4 shadow-2xl animate-slide-up">
                <div className="flex items-center justify-between">
                  <div className="text-amber-400 font-bold text-sm">📲 Instalar en tu Celular</div>
                  <button
                    onClick={() => setShowMobileModal(false)}
                    className="px-2.5 py-1 rounded-full bg-slate-800 text-slate-300 text-xs hover:text-white"
                  >
                    ✕ Cerrar
                  </button>
                </div>

                <div className="bg-white p-3.5 rounded-2xl flex flex-col items-center justify-center">
                  <img
                    src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=http://192.168.0.48:5173/Impulso-Motivacion.apk"
                    alt="QR Code Descargar APK"
                    className="w-44 h-44 rounded-lg"
                  />
                  <span className="text-slate-900 font-bold text-xs mt-2">
                    Escanea para descargar el APK directo
                  </span>
                </div>

                <a
                  href="/Impulso-Motivacion.apk"
                  download="Impulso-Motivacion.apk"
                  className="w-full py-3.5 rounded-2xl bg-gradient-to-r from-amber-400 to-orange-500 text-slate-950 font-bold text-xs flex items-center justify-center gap-2 shadow-lg hover:brightness-105 transition"
                >
                  📥 Descargar Impulso-Motivacion.apk (Directo)
                </a>

                <div className="space-y-1.5 text-xs text-slate-300 leading-relaxed">
                  <p className="font-semibold text-white">¿Cómo instalarlo en tu celular?</p>
                  <p>1. Escanea el código QR de arriba con tu celular (en el mismo Wi-Fi) para bajar <strong className="text-amber-300">Impulso-Motivacion.apk</strong> automáticamente.</p>
                  <p>2. O descarga el archivo aquí en tu PC y pásalo por WhatsApp a tu celular.</p>
                </div>

                {deferredInstallPrompt && (
                  <button
                    onClick={async () => {
                      deferredInstallPrompt.prompt();
                      await deferredInstallPrompt.userChoice;
                      setDeferredInstallPrompt(null);
                    }}
                    className="w-full py-3 rounded-2xl bg-gradient-to-r from-amber-400 to-orange-500 text-slate-950 font-bold text-xs shadow-lg"
                  >
                    📲 Instalar Ahora con 1 Toque
                  </button>
                )}
              </div>
            </div>
          )}

          {/* Main Body */}
          <main className="px-4 pt-4 space-y-5">
            {activeTab === 'home' && (
              <>
                <div className="p-4 rounded-3xl bg-gradient-to-br from-slate-900 via-slate-900 to-indigo-950/60 border border-slate-800 flex items-center justify-between gap-3">
                  <div>
                    <div className="text-xs font-semibold text-amber-300">🔥 Feed personalizado con tu cuestionario</div>
                    <p className="text-xs text-slate-400 mt-0.5">
                      Pilares: {(profile?.categories || ['metas']).map(cid => CATEGORIES.find(c => c.id === cid)?.name).filter(Boolean).join(', ')}
                    </p>
                  </div>
                  <button
                    onClick={() => setShowQuiz(true)}
                    className="px-3 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-semibold text-amber-300 border border-slate-700 flex-shrink-0"
                  >
                    🔄 Test
                  </button>
                </div>

                <div className="flex items-center gap-2 overflow-x-auto pb-1 no-scrollbar">
                  <button
                    onClick={() => {
                      setSelectedCategory('all');
                      nextMomentQuote('all');
                    }}
                    className={`px-3.5 py-2 rounded-2xl text-xs font-semibold whitespace-nowrap transition ${
                      selectedCategory === 'all' ? 'bg-amber-400 text-slate-950' : 'bg-slate-900 text-slate-300 border border-slate-800'
                    }`}
                  >
                    ✨ Para Ti
                  </button>
                  {CATEGORIES.map(cat => (
                    <button
                      key={cat.id}
                      onClick={() => {
                        setSelectedCategory(cat.id);
                        nextMomentQuote(cat.id);
                      }}
                      className={`px-3.5 py-2 rounded-2xl text-xs font-semibold whitespace-nowrap transition ${
                        selectedCategory === cat.id ? 'bg-amber-400 text-slate-950' : 'bg-slate-900 text-slate-300 border border-slate-800'
                      }`}
                    >
                      {cat.emoji} {cat.name}
                    </button>
                  ))}
                </div>

                {/* Single Dynamic Quote Card — changes every time you open the app or receive a notification */}
                {currentQuote && (
                  <div className="space-y-3.5 animate-slide-up" key={currentQuote.id}>
                    <div className="flex items-center justify-between px-1 text-xs">
                      <span className="text-amber-300 font-semibold flex items-center gap-1.5">
                        <span>⚡ Impulso #{impulseCount}</span>
                        <span className="text-slate-500">•</span>
                        <span className="text-slate-400">{lastChangeReason}</span>
                      </span>
                    </div>

                    <QuoteCard
                      item={currentQuote}
                      featured={true}
                      isFavorite={favorites.includes(currentQuote.id)}
                      onToggleFavorite={toggleFavorite}
                      onPinToWidget={pinQuoteToWidget}
                      isPinnedWidget={widgetQuote?.id === currentQuote.id}
                    />

                    <button
                      onClick={() => nextMomentQuote(selectedCategory)}
                      className="w-full py-3.5 px-5 rounded-2xl bg-slate-900 hover:bg-slate-800 border border-amber-400/40 text-amber-300 font-bold text-xs flex items-center justify-center gap-2 transition shadow-lg"
                    >
                      🔄 Cambiar a Otra Frase y Foto Ahora
                    </button>

                    <p className="text-[11px] text-center text-slate-500">
                      Las frases no quedan fijas: cambian automáticamente cada vez que abres la app o cuando te llega una notificación.
                    </p>
                  </div>
                )}
              </>
            )}

            {activeTab === 'widget' && (
              <div className="space-y-5">
                <div>
                  <div className="text-amber-400 text-xs font-bold uppercase tracking-wider mb-1">📱 Widget de Pantalla Principal</div>
                  <h2 className="text-lg font-bold text-white">Configura tu Widget Motivador</h2>
                  <p className="text-xs text-slate-400">
                    Elige el tamaño, fondo y frases que verás en la pantalla de inicio de tu celular o en ventana flotante.
                  </p>
                </div>

                {/* Simulated Android Home Screen Preview */}
                <div className="p-4 rounded-3xl bg-gradient-to-b from-indigo-950/70 via-slate-900 to-slate-950 border border-slate-800 shadow-2xl space-y-4">
                  <div className="flex items-center justify-between text-[11px] text-slate-400 px-2">
                    <span className="font-semibold text-slate-300">
                      {new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}
                    </span>
                    <span className="text-[10px] uppercase tracking-wider px-2.5 py-0.5 rounded-full bg-white/5 border border-white/10 text-amber-300">
                      Vista Previa en Pantalla de Inicio
                    </span>
                    <span>5G 🔋 98%</span>
                  </div>

                  {/* Interactive Widget Preview Box */}
                  <div className="flex justify-center py-1">
                    <div className={`relative rounded-3xl overflow-hidden border border-white/25 shadow-2xl transition-all duration-300 flex flex-col justify-between ${
                      widgetConfig.size === '2x2' ? 'w-56 h-56 p-4' :
                      widgetConfig.size === '4x2' ? 'w-full min-h-[185px] p-4' :
                      'w-full min-h-[300px] p-5'
                    }`}>
                      {widgetConfig.theme === 'photo' && (
                        <>
                          <img src={widgetQuote.image} alt="" className="absolute inset-0 w-full h-full object-cover" />
                          <div className="absolute inset-0 bg-gradient-to-t from-black/90 via-black/55 to-black/30" />
                        </>
                      )}
                      {widgetConfig.theme === 'glass' && <div className="absolute inset-0 bg-slate-900/85 backdrop-blur-xl" />}
                      {widgetConfig.theme === 'gold' && <div className="absolute inset-0 bg-gradient-to-br from-amber-950 via-stone-900 to-slate-950" />}
                      {widgetConfig.theme === 'aurora' && <div className="absolute inset-0 bg-gradient-to-br from-indigo-950 via-teal-950 to-slate-950" />}

                      <div className="relative z-10 flex items-center justify-between">
                        <div className="flex items-center gap-1.5">
                          <span className="w-5 h-5 rounded-lg bg-amber-400 text-slate-950 flex items-center justify-center text-[11px] font-bold">✨</span>
                          <span className="text-[11px] font-bold tracking-wide text-amber-300 uppercase">
                            {CATEGORIES.find(c => c.id === widgetQuote.category)?.name || 'Impulso'}
                          </span>
                        </div>
                        <button
                          onClick={refreshWidgetQuote}
                          className="px-2.5 py-1 rounded-full bg-black/45 hover:bg-black/70 text-[11px] text-white border border-white/15 transition"
                          title="Probar otra frase en el widget"
                        >
                          🔄 Cambiar frase
                        </button>
                      </div>

                      <div className="relative z-10 my-auto py-2">
                        <p className={`font-serif italic text-white font-semibold leading-snug drop-shadow ${
                          widgetConfig.size === '2x2' ? 'text-xs' : widgetConfig.size === '4x2' ? 'text-sm sm:text-base' : 'text-lg'
                        }`}>
                          “{widgetQuote.quote}”
                        </p>
                        <p className="text-[11px] font-semibold text-amber-300 mt-1.5">— {widgetQuote.author}</p>
                      </div>

                      {widgetConfig.size === '4x4' && (
                        <div className="relative z-10 p-2.5 rounded-2xl bg-black/45 border border-white/10 text-[11px] text-slate-200">
                          💡 {widgetQuote.reflection}
                        </div>
                      )}
                    </div>
                  </div>

                  {/* Simulated Home Screen App Icons */}
                  <div className="grid grid-cols-4 gap-3 pt-2 px-3 opacity-80">
                    {['📞 Teléfono', '💬 WhatsApp', '📷 Galería', '✨ Impulso'].map((app, i) => (
                      <div key={i} className="flex flex-col items-center gap-1">
                        <div className={`w-11 h-11 rounded-2xl flex items-center justify-center text-lg border ${
                          i === 3 ? 'bg-gradient-to-br from-amber-400 to-orange-500 text-slate-950 border-amber-300 font-bold' : 'bg-slate-800/80 border-slate-700'
                        }`}>
                          {app.split(' ')[0]}
                        </div>
                        <span className="text-[10px] text-slate-300">{app.split(' ')[1]}</span>
                      </div>
                    ))}
                  </div>
                </div>

                {/* Size & Style Controls */}
                <div className="p-5 rounded-3xl bg-slate-900/90 border border-slate-800 space-y-4">
                  <div>
                    <label className="block text-xs font-bold text-white uppercase tracking-wider mb-2">1. Tamaño del Widget</label>
                    <div className="grid grid-cols-3 gap-2">
                      {[
                        { id: '4x2', label: '4×2 Clásico', desc: 'Horizontal' },
                        { id: '2x2', label: '2×2 Compacto', desc: 'Cuadrado' },
                        { id: '4x4', label: '4×4 Póster', desc: 'Grande HD' }
                      ].map(s => (
                        <button
                          key={s.id}
                          onClick={() => setWidgetConfig(prev => ({ ...prev, size: s.id }))}
                          className={`p-3 rounded-2xl border text-left transition ${
                            widgetConfig.size === s.id ? 'bg-amber-500/20 border-amber-400 text-white' : 'bg-slate-950 border-slate-800 text-slate-400'
                          }`}
                        >
                          <div className="font-bold text-xs text-amber-300">{s.label}</div>
                          <div className="text-[10px] text-slate-400">{s.desc}</div>
                        </button>
                      ))}
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-white uppercase tracking-wider mb-2">2. Fondo Visual del Widget</label>
                    <div className="grid grid-cols-2 gap-2">
                      {[
                        { id: 'photo', label: '🖼️ Foto Motivadora HD' },
                        { id: 'glass', label: '🌑 Cristal Oscuro' },
                        { id: 'gold', label: '✨ Dorado Estoico' },
                        { id: 'aurora', label: '🌌 Aurora Boreal' }
                      ].map(t => (
                        <button
                          key={t.id}
                          onClick={() => setWidgetConfig(prev => ({ ...prev, theme: t.id }))}
                          className={`p-3 rounded-2xl border text-xs font-semibold text-left transition ${
                            widgetConfig.theme === t.id ? 'bg-amber-500/20 border-amber-400 text-white' : 'bg-slate-950 border-slate-800 text-slate-300'
                          }`}
                        >
                          {t.label}
                        </button>
                      ))}
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-white uppercase tracking-wider mb-2">3. Fuente de Frases del Widget</label>
                    <select
                      value={widgetConfig.sourceCategory}
                      onChange={e => setWidgetConfig(prev => ({ ...prev, sourceCategory: e.target.value }))}
                      className="w-full px-3.5 py-2.5 rounded-2xl bg-slate-950 border border-slate-800 text-xs text-white"
                    >
                      <option value="profile">✨ Según mi Cuestionario Motivacional (Recomendado)</option>
                      <option value="favorites">❤️ Solo mis Frases Favoritas guardadas</option>
                      {CATEGORIES.map(c => (
                        <option key={c.id} value={c.id}>{c.emoji} Solo {c.name}</option>
                      ))}
                    </select>
                  </div>
                </div>

                {/* Action Buttons */}
                <div className="space-y-3">
                  <button
                    onClick={() => {
                      setSavedWidgetToast(true);
                      setTimeout(() => setSavedWidgetToast(false), 2500);
                    }}
                    className="w-full py-3.5 rounded-2xl bg-gradient-to-r from-amber-400 to-orange-500 text-slate-950 font-bold text-xs shadow-lg shadow-amber-500/20 hover:brightness-105 transition"
                  >
                    {savedWidgetToast ? '✓ ¡Widget Guardado y Activado!' : '✨ Guardar Configuración de mi Widget'}
                  </button>

                  <button
                    onClick={openFloatingWidgetWindow}
                    className="w-full py-3.5 rounded-2xl bg-slate-900 hover:bg-slate-800 border border-amber-400/50 text-amber-300 font-bold text-xs transition"
                  >
                    🪟 Abrir como Widget Flotante Independiente Ahora
                  </button>

                  <div className="p-4 rounded-2xl bg-slate-900/70 border border-slate-800 text-xs text-slate-400 space-y-1">
                    <div className="font-bold text-slate-200">📲 Cómo agregarlo a la pantalla de inicio en Android:</div>
                    <p>1. Mantén presionado un espacio libre en tu pantalla de inicio y toca <strong className="text-amber-300">Widgets</strong>.</p>
                    <p>2. Elige <strong className="text-amber-300">Impulso Motivación</strong> y arrástralo.</p>
                    <p>3. En cualquier tarjeta del inicio también puedes tocar <strong className="text-amber-300">📌 Widget</strong> para enviar esa frase y foto directo a tu widget.</p>
                  </div>
                </div>
              </div>
            )}

            {activeTab === 'favorites' && (
              <div className="space-y-4">
                <h2 className="text-lg font-bold text-white">❤️ Tus Frases Favoritas ({favoriteQuotes.length})</h2>
                {favoriteQuotes.map(item => (
                  <QuoteCard key={item.id} item={item} isFavorite={true} onToggleFavorite={toggleFavorite} />
                ))}
              </div>
            )}

            {activeTab === 'settings' && (
              <div className="space-y-4">
                <div className="p-5 rounded-3xl bg-gradient-to-br from-amber-500/20 via-orange-500/10 to-slate-900 border border-amber-500/40 space-y-3">
                  <div className="text-amber-300 font-bold text-sm">🔔 Probar Notificación con Foto y Frase</div>
                  <p className="text-xs text-slate-300">
                    Dispara inmediatamente una notificación motivadora basada en las respuestas de tu cuestionario.
                  </p>
                  <button
                    onClick={() => triggerMotivation()}
                    className="w-full py-3 rounded-2xl bg-gradient-to-r from-amber-400 to-orange-500 text-slate-950 font-bold text-xs"
                  >
                    Enviar Notificación Motivadora Ahora
                  </button>
                </div>

                <div className="p-5 rounded-3xl bg-slate-900 border border-slate-800 space-y-3">
                  <h3 className="font-bold text-sm text-white">🔄 Cuestionario de Personalización</h3>
                  <p className="text-xs text-slate-400">
                    Vuelve a realizar las 5 preguntas para cambiar tus categorías, estilo de fotos u horarios.
                  </p>
                  <button
                    onClick={() => setShowQuiz(true)}
                    className="w-full py-3 rounded-2xl bg-slate-800 hover:bg-slate-700 text-amber-300 font-semibold text-xs border border-slate-700"
                  >
                    Repetir Cuestionario Ahora
                  </button>
                </div>
              </div>
            )}
          </main>

          {/* Bottom Navigation */}
          <nav className="fixed bottom-0 inset-x-0 z-40 max-w-md mx-auto bg-slate-950/90 backdrop-blur-xl border-t border-slate-900 px-4 py-2.5 flex items-center justify-around">
            <button onClick={() => setActiveTab('home')} className={`flex flex-col items-center gap-1 text-xs font-semibold ${activeTab === 'home' ? 'text-amber-400' : 'text-slate-500'}`}>
              <span>✨</span>
              <span>Para Ti</span>
            </button>
            <button onClick={() => setActiveTab('widget')} className={`flex flex-col items-center gap-1 text-xs font-semibold ${activeTab === 'widget' ? 'text-amber-400' : 'text-slate-500'}`}>
              <span>📱</span>
              <span>Widget</span>
            </button>
            <button onClick={() => setActiveTab('favorites')} className={`flex flex-col items-center gap-1 text-xs font-semibold ${activeTab === 'favorites' ? 'text-amber-400' : 'text-slate-500'}`}>
              <span>❤️</span>
              <span>Favoritos ({favorites.length})</span>
            </button>
            <button onClick={() => setActiveTab('settings')} className={`flex flex-col items-center gap-1 text-xs font-semibold ${activeTab === 'settings' ? 'text-amber-400' : 'text-slate-500'}`}>
              <span>🔔</span>
              <span>Alertas y Test</span>
            </button>
          </nav>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
